name: Paper Plane Dart Format Fix

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  format-and-commit:
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Install Flutter 3.47.0
        uses: subosito/flutter-action@v2
        with:
          flutter-version: 3.47.0
          channel: stable
          cache: true

      - name: Resolve dependencies
        run: flutter pub get

      - name: Canonically format Dart source
        run: dart format lib test integration_test test_driver

      - name: Validate patch whitespace
        run: git diff --check

      - name: Commit canonical formatting
        shell: bash
        run: |
          if git diff --quiet; then
            echo "Repository is already canonically formatted."
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add lib test integration_test test_driver
          git commit -m "Format Dart sources"
          git push origin HEAD:main
