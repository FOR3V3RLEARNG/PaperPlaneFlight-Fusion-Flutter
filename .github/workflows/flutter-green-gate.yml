name: Paper Plane Flight Green Gate

on:
  workflow_dispatch:
  pull_request:
  push:
    branches: [main, 'fusion/**']

concurrency:
  group: paper-plane-${{ github.ref }}
  cancel-in-progress: true

jobs:
  certify:
    name: Certify Flutter ${{ matrix.flutter }}
    strategy:
      fail-fast: false
      matrix:
        flutter: ['3.47.0', '3.44.7']
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@v6

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ matrix.flutter }}
          channel: stable
          cache: true

      - name: Scaffold Android when source-only
        shell: bash
        run: |
          if [ ! -d android ]; then
            scaffold_dir="$(mktemp -d)"
            pushd "$scaffold_dir"
            flutter create --platforms=android --project-name=paper_plane_flight paper_plane_scaffold
            popd
            cp -R "$scaffold_dir/paper_plane_scaffold/android" ./android
            rm -rf "$scaffold_dir"
          fi

      - run: flutter doctor -v
      - run: flutter pub get

      - name: Dependency visibility
        run: dart pub outdated || true

      - name: Parse and format pass
        run: dart format --output=none --set-exit-if-changed lib test integration_test

      - name: Analyze
        run: flutter analyze --fatal-warnings

      - name: Unit and widget tests
        run: flutter test --coverage

  android-integration:
    name: Android integration smoke
    needs: certify
    runs-on: ubuntu-latest
    timeout-minutes: 35

    steps:
      - uses: actions/checkout@v6

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.0'
          channel: stable
          cache: true

      - name: Scaffold Android when source-only
        shell: bash
        run: |
          if [ ! -d android ]; then
            scaffold_dir="$(mktemp -d)"
            pushd "$scaffold_dir"
            flutter create --platforms=android --project-name=paper_plane_flight paper_plane_scaffold
            popd
            cp -R "$scaffold_dir/paper_plane_scaffold/android" ./android
            rm -rf "$scaffold_dir"
          fi

      - run: flutter pub get

      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' \
            | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm || true
          sudo chmod 666 /dev/kvm || true

      - name: Run v2.2 Android integration journey
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          target: google_apis
          arch: x86_64
          profile: pixel_6
          disable-animations: true
          emulator-boot-timeout: 600
          emulator-options: >-
            -no-window
            -gpu swiftshader_indirect
            -no-snapshot
            -noaudio
            -no-boot-anim
          script: |
            adb devices
            flutter devices
            flutter drive --driver=test_driver/integration_test.dart --target=integration_test/app_smoke_test.dart -d emulator-5554 --no-dds

  release-android:
    name: Release APK + AAB
    needs: [certify, android-integration]
    runs-on: ubuntu-latest
    timeout-minutes: 35

    steps:
      - uses: actions/checkout@v6

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.0'
          channel: stable
          cache: true

      - name: Scaffold Android when source-only
        shell: bash
        run: |
          if [ ! -d android ]; then
            scaffold_dir="$(mktemp -d)"
            pushd "$scaffold_dir"
            flutter create --platforms=android --project-name=paper_plane_flight paper_plane_scaffold
            popd
            cp -R "$scaffold_dir/paper_plane_scaffold/android" ./android
            rm -rf "$scaffold_dir"
          fi

      - run: flutter pub get
      - run: flutter analyze --fatal-warnings
      - run: flutter test
      - run: flutter build apk --release
      - run: flutter build appbundle --release

      - name: Verify release artifacts
        run: |
          test -s build/app/outputs/flutter-apk/app-release.apk
          test -s build/app/outputs/bundle/release/app-release.aab
          ls -lh build/app/outputs/flutter-apk/app-release.apk
          ls -lh build/app/outputs/bundle/release/app-release.aab

      - uses: actions/upload-artifact@v4
        with:
          name: paper-plane-flight-v2-2-android
          path: |
            build/app/outputs/flutter-apk/app-release.apk
            build/app/outputs/bundle/release/app-release.aab
          if-no-files-found: error
          retention-days: 14
