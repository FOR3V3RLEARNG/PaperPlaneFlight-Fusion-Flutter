name: Paper Plane Flight Green Gate

on:
  workflow_dispatch:
  pull_request:
  push:
    branches: [main, 'fusion/**']

concurrency:
  group: paper-plane-${{ github.ref }}
  cancel-in-progress: true

jobs:
  certify:
    name: Certify Flutter ${{ matrix.flutter }}
    strategy:
      fail-fast: false
      matrix:
        flutter: ['3.47.0', '3.44.7']
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ matrix.flutter }}
          channel: stable
          cache: true

      - name: Scaffold Android when source-only
        run: |
          if [ ! -d android ]; then
            flutter create --platforms=android --project-name=paper_plane_flight .
            rm -f test/widget_test.dart
            git checkout -- test/widget_test.dart 2>/dev/null || true
          fi

      - run: flutter doctor -v
      - run: flutter pub get

      - name: Dependency visibility
        run: dart pub outdated || true

      - name: Parse and format pass
        run: dart format --output=none lib test integration_test

      - name: Analyze
        run: flutter analyze --fatal-warnings

      - name: Unit and widget tests
        run: flutter test --coverage

  android-integration:
    name: Android runtime smoke test
    needs: certify
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.0'
          channel: stable
          cache: true

      - name: Scaffold Android when source-only
        run: |
          if [ ! -d android ]; then
            flutter create --platforms=android --project-name=paper_plane_flight .
            rm -f test/widget_test.dart
            git checkout -- test/widget_test.dart 2>/dev/null || true
          fi

      - run: flutter pub get

      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' \
            | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Build, install, launch and verify Android runtime
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          arch: x86_64
          profile: pixel_6
          ram-size: 2048M
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -no-snapshot -no-metrics -camera-back none
          script: |
            set -e
            flutter devices
            flutter build apk --debug
            adb -s emulator-5554 install -r build/app/outputs/flutter-apk/app-debug.apk
            adb -s emulator-5554 logcat -c
            adb -s emulator-5554 shell am force-stop com.example.paper_plane_flight
            adb -s emulator-5554 shell monkey -p com.example.paper_plane_flight -c android.intent.category.LAUNCHER 1
            sleep 10
            PID="$(adb -s emulator-5554 shell pidof com.example.paper_plane_flight | tr -d '\r')"
            if [ -z "$PID" ]; then
              echo "Paper Plane Flight process is not running after launch"
              adb -s emulator-5554 logcat -d -t 300
              exit 1
            fi
            echo "Paper Plane Flight running as PID $PID"
            adb -s emulator-5554 shell dumpsys activity activities | grep -m1 'com.example.paper_plane_flight' || true
            if adb -s emulator-5554 logcat -d -t 500 | grep -E 'FATAL EXCEPTION|Process: com\.example\.paper_plane_flight.*has died'; then
              echo "Fatal Android runtime error detected"
              exit 1
            fi
            echo "Android runtime smoke test passed"

  release-android:
    name: Release APK + AAB
    needs: [certify, android-integration]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.0'
          channel: stable
          cache: true

      - name: Scaffold Android when source-only
        run: |
          if [ ! -d android ]; then
            flutter create --platforms=android --project-name=paper_plane_flight .
            rm -f test/widget_test.dart
            git checkout -- test/widget_test.dart 2>/dev/null || true
          fi

      - run: flutter pub get
      - run: flutter analyze --fatal-warnings
      - run: flutter test
      - run: flutter build apk --release
      - run: flutter build appbundle --release
      - run: test -f build/app/outputs/flutter-apk/app-release.apk
      - run: test -f build/app/outputs/bundle/release/app-release.aab

      - uses: actions/upload-artifact@v4
        with:
          name: paper-plane-flight-android
          path: |
            build/app/outputs/flutter-apk/app-release.apk
            build/app/outputs/bundle/release/app-release.aab
          if-no-files-found: error
