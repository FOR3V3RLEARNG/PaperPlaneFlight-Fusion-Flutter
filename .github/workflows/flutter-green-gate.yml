name: Paper Plane Flight Green Gate

on:
  workflow_dispatch:
  pull_request:
  push:
    branches: [main, 'fusion/**']

concurrency:
  group: paper-plane-${{ github.ref }}
  cancel-in-progress: true

jobs:
  certify:
    name: Certify Flutter ${{ matrix.flutter }}
    strategy:
      fail-fast: false
      matrix:
        flutter: ['3.47.0', '3.44.7']
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ matrix.flutter }}
          channel: stable
          cache: true
      - name: Scaffold platform folders when source-only
        run: |
          if [ ! -d android ]; then
            flutter create --platforms=android --project-name=paper_plane_flight .
          fi
      - run: flutter doctor -v
      - run: flutter pub get
      - name: Dependency visibility
        run: dart pub outdated || true
      - name: Parse and format pass
        run: dart format --output=none lib test integration_test
      - name: Analyze
        run: flutter analyze --fatal-warnings
      - name: Unit and widget tests
        run: flutter test --coverage
      - name: Integration smoke tests
        run: flutter test integration_test

  release-android:
    name: Release APK + AAB
    needs: certify
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.0'
          channel: stable
          cache: true
      - name: Scaffold Android when source-only
        run: |
          if [ ! -d android ]; then
            flutter create --platforms=android --project-name=paper_plane_flight .
          fi
      - run: flutter pub get
      - run: flutter analyze --fatal-warnings
      - run: flutter test
      - run: flutter build apk --release
      - run: flutter build appbundle --release
      - run: test -f build/app/outputs/flutter-apk/app-release.apk
      - run: test -f build/app/outputs/bundle/release/app-release.aab
      - uses: actions/upload-artifact@v4
        with:
          name: paper-plane-flight-android
          path: |
            build/app/outputs/flutter-apk/app-release.apk
            build/app/outputs/bundle/release/app-release.aab
          if-no-files-found: error
